<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#2563eb" />
  <!-- We draw our own dark mode: phone browsers (Samsung Internet, Chrome auto-dark) must not re-colour the page. -->
  <meta name="color-scheme" content="light dark" />
  <script>
    // Set dark mode before the app loads, so there is no white flash. Same rule as ThemeProvider.
    (function () { try { var t = localStorage.getItem('theme');
      var d = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var r = document.documentElement; r.classList.toggle('dark', d); r.style.colorScheme = d ? 'dark' : 'light';
    } catch (e) { } })();
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LCO Desk" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <title>LCO Desk</title>
  <style>
    #app-loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #f8fafc; z-index: 9999; }
    #app-loading .spinner { width: 40px; height: 40px; border: 3px solid #e2e8f0; border-top-color: #2563eb; border-radius: 50%; animation: app-load-spin 0.7s linear infinite; margin: 0 auto 12px; }
    #app-loading .text { color: #64748b; font-size: 14px; font-family: system-ui, sans-serif; }
    @keyframes app-load-spin { to { transform: rotate(360deg); } }
    html.dark #app-loading { background: #0f172a; }
    html.dark #app-loading .spinner { border-color: #334155; border-top-color: #3b82f6; }
    html.dark #app-loading .text { color: #94a3b8; }
  </style>
</head>

<body>
  <div id="app-loading" aria-live="polite" aria-label="Loading">
    <div style="text-align: center;">
      <div class="spinner"></div>
      <p class="text">Loading...</p>
    </div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
